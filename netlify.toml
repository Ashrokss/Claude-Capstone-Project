# Netlify configuration for the VeriClaim frontend.
#
# Only the Next.js app is deployed here. The FastAPI backend cannot run on
# Netlify: analysis is handled by a long-lived in-process worker pool that
# takes minutes per claim, and Netlify functions are short-lived and
# JavaScript-only. See DEPLOYMENT.md — it goes on Render.

[build]
  # The app is not at the repository root, so every path below is relative to
  # this directory.
  base = "frontend"
  command = "npm run build"
  publish = ".next"

# Without this, Netlify auto-detection did not engage the Next.js runtime: the
# build succeeded, `.next` was published as a directory of static files, and
# every route returned 404 while /BUILD_ID returned 200. Declaring the plugin
# is explicit and is a no-op if the runtime would have loaded anyway. Netlify
# installs it during the build, so it does not belong in package.json.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

  # Closes registration on the deployed site. Every claim spends real NVIDIA
  # and Gemini quota, so an open sign-up form on a public URL is an open tab
  # against your account.
  #
  # This only hides the control. Supabase's auth API is still reachable with
  # the publishable key, so signups must ALSO be disabled in
  # Supabase → Authentication → Sign In / Providers. That is the real boundary.
  NEXT_PUBLIC_ALLOW_SIGNUP = "false"

# The three NEXT_PUBLIC_* values below are deliberately NOT set here. They are
# compiled into the client bundle at build time, and NEXT_PUBLIC_API_URL is not
# known until the backend is deployed. Set them in the Netlify UI under
# Site configuration → Environment variables:
#
#   NEXT_PUBLIC_SUPABASE_URL       your Supabase project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  the publishable key (public by design)
#   NEXT_PUBLIC_API_URL            https://<your-render-service>.onrender.com
#
# Changing any of them needs a fresh deploy, not just a save — a restart alone
# leaves the browser running whatever was compiled in.
